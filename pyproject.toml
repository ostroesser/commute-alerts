[project]
name = "commute-alerts"
version = "0.1.0"
description = "Alertes ntfy de perturbations TER par ligne et fenêtre horaire (GTFS / GTFS-RT SNCF)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "gtfs-realtime-bindings>=3.0",
    "protobuf>=6",
    "httpx>=0.28,<0.29",
    "pydantic>=2.9,<3",
    "PyYAML>=6.0,<7",
    "holidays>=0.60",
    "tzdata",
]

[project.scripts]
commute-alerts = "commute_alerts.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.7",
    "mypy>=1.13",
    "types-PyYAML",
    "types-protobuf",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/commute_alerts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "S"]
ignore = ["RUF001", "RUF002", "RUF003"]  # textes français (apostrophes, flèches)

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S106"]  # assert pytest, faux jetons de test

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["commute_alerts"]

[[tool.mypy.overrides]]
module = ["google.transit.*"]
ignore_missing_imports = true
